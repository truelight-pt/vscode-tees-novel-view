<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tee's Novel View のアイコン（media/icon.png の元データ） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5288"/>
      <stop offset="1" stop-color="#18294A"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="1" stop-color="#E9E2D0"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E2D0"/>
      <stop offset="1" stop-color="#FBF7EC"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- 本の影 -->
  <path d="M30 78 Q78 66 128 84 Q178 66 226 78 L226 204 Q178 192 128 210 Q78 192 30 204 Z" fill="#0E1A30" opacity="0.45" transform="translate(0 6)"/>

  <!-- 左右のページ -->
  <path d="M30 74 Q78 62 128 80 L128 206 Q78 188 30 200 Z" fill="url(#pageL)"/>
  <path d="M226 74 Q178 62 128 80 L128 206 Q178 188 226 200 Z" fill="url(#pageR)"/>
  <!-- 綴じ目 -->
  <path d="M128 80 L128 206" stroke="#C9BFA6" stroke-width="2"/>

  <!-- 左のページ: 色分けされた行 -->
  <g stroke-linecap="round" stroke-width="7">
    <path d="M46 96 Q76 90 112 98" stroke="#8A8577"/>
    <path d="M46 118 Q76 112 112 120" stroke="#3FB950"/>
    <path d="M46 140 Q70 135 98 140" stroke="#3FB950"/>
    <path d="M46 162 Q76 156 112 164" stroke="#4FC1FF"/>
    <path d="M46 184 Q70 179 92 183" stroke="#8A8577"/>
  </g>

  <!-- 右のページ: ルビ付きの漢字 -->
  <text x="177" y="118" text-anchor="middle" font-family="'HGMinchoE', 'HG明朝E', 'Yu Mincho Demibold', 'Yu Mincho', serif" font-size="26" fill="#FF9E3D">よ</text>
  <text x="177" y="184" text-anchor="middle" font-family="'HGMinchoE', 'HG明朝E', 'Yu Mincho Demibold', 'Yu Mincho', serif" font-size="70" fill="#1E2B45">読</text>
</svg>
